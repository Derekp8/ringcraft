name: Deploy Ringcraft to GitHub Pages

on:
  push:
    branches:
      - development/launchable-web
      - development/pwa-installable
  pull_request:
    branches:
      - development/m15-release-candidate-hardening
      - development/launchable-web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ringcraft-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Smoke-test one-click launcher
        shell: cmd
        run: call "Launch Ringcraft.bat" --check

  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Ringcraft automated tests
        run: npm run test

      - name: Verify deterministic fixtures and replays
        run: npm run fixtures:verify

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and statically verify GitHub Pages PWA
        shell: bash
        run: |
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          npm run build -- --base="$BASE_PATH"
          node scripts/verify-pwa.mjs --root=dist --base="$BASE_PATH"
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pwa-browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages-path production PWA
        shell: bash
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"

      - name: Verify PWA artifact
        shell: bash
        run: node scripts/verify-pwa.mjs --root=dist --base="/${GITHUB_REPOSITORY#*/}/"

      - name: Verify Chromium installability, offline relaunch, and update safety
        run: node scripts/pwa-e2e.mjs

      - name: Upload PWA installability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringcraft-pwa-installability
          path: output/readiness/pwa-installability.json
          if-no-files-found: warn

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs:
      - launcher-smoke
      - regression
      - build
      - pwa-browser
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs:
      - deploy
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed HTTPS PWA in Chromium
        run: node scripts/pwa-live-smoke.mjs "${{ needs.deploy.outputs.page_url }}"

      - name: Upload hosted PWA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringcraft-pwa-live-smoke
          path: output/readiness/pwa-live-smoke.json
          if-no-files-found: warn

  certify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs:
      - live-smoke
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for same-SHA external gates and build certification report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PAGES_RUN_ID: ${{ github.run_id }}
          BASE_SHA: 18708afc89f58cfb37bd9dc6e2b0aeeb4a9c67bc
        run: node scripts/pwa-c1-certify.mjs

      - name: Upload PWA-C1 certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringcraft-pwa-c1-certification-${{ github.sha }}
          path: output/readiness/pwa-installability-certification.json
          if-no-files-found: error
