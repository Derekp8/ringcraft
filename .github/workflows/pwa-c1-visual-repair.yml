name: PWA-C1 one-time visual harness repair

on:
  push:
    branches:
      - development/pwa-installable
    paths:
      - scripts/pwa-c1-repair-visual-harness.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PWA branch head
        uses: actions/checkout@v7
        with:
          ref: development/pwa-installable
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Repair visual QA expectations
        run: node scripts/pwa-c1-repair-visual-harness.mjs

      - name: Commit repaired visual harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-qa.mjs
          git diff --cached --check
          git commit -m "test: align visual QA with hardened save semantics"
          git pull --rebase origin development/pwa-installable
          git push origin HEAD:development/pwa-installable
