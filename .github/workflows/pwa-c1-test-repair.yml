name: PWA-C1 one-time remote-sync test repair

on:
  push:
    branches:
      - development/pwa-installable
    paths:
      - scripts/pwa-c1-repair-remote-sync-test.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PWA branch head
        uses: actions/checkout@v7
        with:
          ref: development/pwa-installable
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Repair remote-sync fixture semantics
        run: node scripts/pwa-c1-repair-remote-sync-test.mjs

      - name: Commit repaired test fixture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/mock-save-sync-server.test.ts
          git diff --cached --check
          git commit -m "test: use canonical remote-sync save identities"
          git push origin HEAD:development/pwa-installable
