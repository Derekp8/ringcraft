name: m15-readiness

on:
  pull_request:
    branches:
      - development/m14-playable-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify compliance registry
        run: node scripts/verify-manual-compliance.mjs
      - name: Verify Strict Manual, RNG/replay, and QA remediation boundaries
        run: npm exec -- vitest run tests/m14-manual-mode.test.ts tests/m15-strict-manual.test.ts tests/m14-playable-readiness.test.ts tests/randomized-play-fair-ai.test.ts tests/save-determinism.test.ts tests/qa-remediation-save-manager.test.ts tests/qa-remediation-ui-boundaries.test.mjs
      - name: Production build
        run: npm run build

  ai-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Verify deterministic AI decision-quality corpus
        run: npm exec -- vitest run tests/m15-ai-quality.test.ts
      - name: Generate machine-readable AI quality report
        run: node scripts/run-typescript-module.mjs scripts/generate-m15-ai-quality.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-ai-decision-quality
          path: output/readiness/ai-decision-quality.json
          if-no-files-found: warn

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run browser remediation journeys A-H
        run: node scripts/browser-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-browser-e2e
          path: output/readiness/browser-e2e.json
          if-no-files-found: warn
