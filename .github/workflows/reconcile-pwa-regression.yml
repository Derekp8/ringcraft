name: Reconcile PWA regression baseline

on:
  push:
    branches:
      - development/pwa-installable
    paths:
      - scripts/reconcile-pwa-regression-baseline.mjs
      - .github/workflows/reconcile-pwa-regression.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message || '', 'chore: reconcile stale PWA regression evidence') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v7
        with:
          ref: development/pwa-installable
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Reconcile stale tests and manifest pins
        run: node scripts/reconcile-pwa-regression-baseline.mjs

      - name: Commit reconciled evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/save-manager.test.ts tests/mock-save-sync-server.test.ts HANDOFF-MANIFEST.json
          git diff --cached --check
          git commit -m "chore: reconcile stale PWA regression evidence"
          git push origin HEAD:development/pwa-installable
