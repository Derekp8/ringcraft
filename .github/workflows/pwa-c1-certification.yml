name: PWA-C1 certification

on:
  workflow_run:
    workflows:
      - Deploy Ringcraft to GitHub Pages
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  certify:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'development/pwa-installable'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build same-SHA certification report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
          BASE_SHA: 18708afc89f58cfb37bd9dc6e2b0aeeb4a9c67bc
        run: node scripts/pwa-c1-certify.mjs

      - name: Upload PWA-C1 certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringcraft-pwa-c1-certification-${{ github.event.workflow_run.head_sha }}
          path: output/readiness/pwa-installability-certification.json
          if-no-files-found: error
