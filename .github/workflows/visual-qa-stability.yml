# Visual QA stability gate
#
# Two different evidence claims are enforced deliberately:
# 1. committed reviewed screenshot blobs must still match HANDOFF-MANIFEST.json;
# 2. the hosted Linux renderer must reproduce itself across two consecutive
#    visual-QA runs within the harness's documented AA tolerance.
#
# The reviewed captures were not produced by this hosted runner environment.
# Cross-OS/font-rasterizer layout differences are therefore reported by the
# review evidence, not hidden by re-pinning screenshots to whatever CI renders.

name: visual-qa-stability

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: visual-qa-stability
  cancel-in-progress: false

jobs:
  double-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FONTCONFIG_FILE: /etc/fonts/fonts.conf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install canonical QA fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-inter fonts-urw-base35
          fc-match Inter | grep -q "Inter"
          fc-match "Arial Narrow" | grep -q "NimbusSansNarrow"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit per project + tsc -b build mode)
        run: npm run typecheck

      - name: Verify reviewed pins and hosted-runner visual stability
        run: node scripts/check-visual-qa-ci-stability.mjs
