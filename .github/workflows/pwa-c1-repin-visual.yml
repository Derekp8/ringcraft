name: PWA-C1 one-time visual manifest repin

on:
  push:
    branches:
      - development/pwa-installable
    paths:
      - .github/workflows/pwa-c1-repin-visual.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PWA branch head
        uses: actions/checkout@v7
        with:
          ref: development/pwa-installable
          fetch-depth: 0

      - name: Re-pin only the intended visual QA critical file
        shell: bash
        run: |
          HASH=$(sha256sum scripts/visual-qa.mjs | awk '{print $1}')
          node - "$HASH" <<'NODE'
          const fs = require('node:fs');
          const hash = process.argv[2];
          const path = 'HANDOFF-MANIFEST.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!manifest.critical_file_sha256?.['scripts/visual-qa.mjs']) throw new Error('visual QA pin missing');
          manifest.critical_file_sha256['scripts/visual-qa.mjs'] = hash;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          console.log(`scripts/visual-qa.mjs ${hash}`);
          NODE

      - name: Commit manifest evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF-MANIFEST.json
          git diff --cached --check
          git commit -m "chore: repin repaired visual QA evidence"
          git pull --rebase origin development/pwa-installable
          git push origin HEAD:development/pwa-installable
