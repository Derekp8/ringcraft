name: manifest-pins

on:
  push:
  pull_request:

jobs:
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fast fail before the pin check: the solution tsconfig.json is a
      # project-references shell (files: []), so a bare tsc --noEmit checks
      # nothing. npm run typecheck runs the per-project emit-free pass and the
      # build-mode tsc -b pass that follows the references exactly like
      # npm run build, so build-only type errors abort this gate instead of
      # reaching the archive/clean-room path.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit per project + tsc -b build mode)
        run: npm run typecheck

      # Every critical_file_sha256 pin must equal the sha256 of the pinned
      # file's committed LF blob. Pins computed from a different working-tree
      # representation (e.g. CRLF on Windows) pass an on-disk check but fail
      # the clean-room 45/45 verification, so this gate hashes git blobs
      # directly and fails the moment any pin drifts.
      - name: Verify manifest pins against LF git blobs
        run: node scripts/check-manifest-pins.mjs
